# BETA-088 — operator-triggered live testnet gates (requires protected environment approval).
#
# Fork PRs and default CI never receive testnet secrets. This workflow runs only
# on workflow_dispatch against the testnet GitHub Environment.

name: Beta Live Testnet Gates

on:
  workflow_dispatch:
    inputs:
      run_integration_gate:
        description: Run full Soroban integration gate (deploy + verify)
        type: boolean
        default: true
      run_live_workflow2:
        description: Run Workflow 2 live testnet journey
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24"

jobs:
  beta-soroban-live:
    name: Soroban Live Integration Gate
    if: inputs.run_integration_gate
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Install Stellar CLI
        run: curl -sSfL https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-linux-x64.tar.gz | tar -xz -C /usr/local/bin

      - name: Run integration gate
        run: npx tsx scripts/stellar/smoke/integration-gate.ts
        env:
          STEALTH_LIVE_TEST: "1"

      - name: Write gate result
        if: always()
        run: |
          STATUS=pass
          if [ "${{ job.status }}" != "success" ]; then STATUS=fail; fi
          node scripts/ci/write-gate-result.mjs \
            --gate-id beta-soroban-live \
            --name "Soroban Live Integration Gate" \
            --owner platform/contracts \
            --dependency BETA-086 \
            --status "$STATUS" \
            --evidence-json '{"command":"npx tsx scripts/stellar/smoke/integration-gate.ts","environment":"testnet"}'

      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-beta-soroban-live
          path: gate-result-beta-soroban-live.json
          retention-days: 30

  beta-live-workflow2:
    name: Workflow 2 Live Testnet
    if: inputs.run_live_workflow2
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run live testnet journey
        run: bun x vitest run tests/e2e/live-beta/workflow2.test.ts -t "live testnet"
        env:
          STEALTH_LIVE_TEST: "1"
          STEALTH_TESTNET_SECRET: ${{ secrets.STEALTH_TESTNET_SECRET }}
          STEALTH_ALICE_SECRET: ${{ secrets.STEALTH_ALICE_SECRET }}
          STEALTH_BOB_SECRET: ${{ secrets.STEALTH_BOB_SECRET }}
          STEALTH_RELAY_ENDPOINT: ${{ secrets.STEALTH_RELAY_ENDPOINT }}
          STEALTH_POSTAGE_CONTRACT_ID: ${{ vars.STEALTH_POSTAGE_CONTRACT_ID }}
          STEALTH_RECEIPTS_CONTRACT_ID: ${{ vars.STEALTH_RECEIPTS_CONTRACT_ID }}

      - name: Redact and upload run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-beta-run-report
          path: tests/e2e/live-beta/run-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Write gate result
        if: always()
        run: |
          STATUS=pass
          if [ "${{ job.status }}" != "success" ]; then STATUS=fail; fi
          node scripts/ci/write-gate-result.mjs \
            --gate-id beta-live-workflow2 \
            --name "Workflow 2 Live Testnet" \
            --owner protocol/relay \
            --dependency BETA-050 \
            --status "$STATUS"

      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-beta-live-workflow2
          path: gate-result-beta-live-workflow2.json
          retention-days: 30
