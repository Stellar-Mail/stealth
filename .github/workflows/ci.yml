name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate pull request metadata and scope
        env:
          BASE_REF: ${{ github.base_ref }}
          LARGE_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'large-change-approved') }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title_pattern='^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! grep -Eq "$title_pattern" <<< "$PR_TITLE"; then
            echo "PR title must use Conventional Commits format." >&2
            exit 1
          fi

          for heading in "## Summary" "## Validation"; do
            if ! grep -Fq "$heading" <<< "$PR_BODY"; then
              echo "PR body is missing required heading: $heading" >&2
              exit 1
            fi
          done

          if ! grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|related)[[:space:]:]*#[0-9]+' <<< "$PR_BODY"; then
            echo "PR body must link an issue using Closes, Fixes, Resolves, or Related: #123." >&2
            exit 1
          fi

          git fetch --no-tags origin "$BASE_REF"
          changed_files=$(git diff --name-only "origin/$BASE_REF...HEAD" | wc -l | tr -d ' ')
          changed_lines=$(git diff --numstat "origin/$BASE_REF...HEAD" | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { total += $1 + $2 } END { print total + 0 }')

          echo "Changed files: $changed_files"
          echo "Changed text lines: $changed_lines"

          if { [ "$changed_files" -gt 75 ] || [ "$changed_lines" -gt 8000 ]; } && [ "$LARGE_CHANGE_APPROVED" != "true" ]; then
            echo "Large PRs require the large-change-approved label and maintainer justification." >&2
            exit 1
          fi

  client-checks:
    name: Client Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Generate Route Tree
        run: bun scripts/generate-route-tree.ts

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Generate OpenAPI
        run: bun run generate:openapi

      - name: OpenAPI Compatibility
        run: |
          # Install Optic into a dedicated env with AJV overrides.
          # @useoptic/optic@1.0.9 bundles @stoplight/spectral-core whose
          # nested AJV generates broken function code (SyntaxError: ':').
          # Forcing ajv>=8.17.1 via npm overrides dedups the nested copy
          # so spectral-core uses the patched version instead.
          # Note: no setup-node step — runner's default Node 24 is used
          # so that subsequent steps (vitest / @cloudflare/vite-plugin)
          # still have access to node:module.registerHooks (Node >=23.5).
          mkdir -p /tmp/optic-env
          cd /tmp/optic-env
          cat > package.json << 'EOF'
          {
            "name": "optic-env",
            "version": "1.0.0",
            "overrides": {
              "ajv": ">=8.17.1",
              "ajv-errors": ">=3.0.0"
            }
          }
          EOF
          npm install --save-exact @useoptic/optic@1.0.9 --prefer-online
          cd "$GITHUB_WORKSPACE"
          /tmp/optic-env/node_modules/.bin/optic diff openapi.json --base origin/main --check
        env:
          OPTIC_TOKEN: ${{ secrets.OPTIC_TOKEN }}

      - name: Unit Tests
        run: bun run test

      - name: Build Client
        run: bun run build

      - name: Upload Client Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-dist
          path: dist/
          retention-days: 1

  contract-checks:
    name: Contract Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32v1-none

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: contracts/soroban

      - name: Test Contracts
        run: |
          cd contracts/soroban
          cargo test --workspace

      - name: Build Contracts
        run: |
          cd contracts/soroban
          cargo build --target wasm32v1-none --release

      - name: Wasm Size
        run: |
          echo "### Wasm Binary Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          TARGET_DIR="contracts/soroban/target/wasm32v1-none/release"
          if [ -d "$TARGET_DIR" ]; then
            for wasm in $TARGET_DIR/*.wasm; do
              if [ -f "$wasm" ]; then
                size=$(ls -lh "$wasm" | awk '{print $5}')
                name=$(basename "$wasm")
                echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "Target directory $TARGET_DIR not found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Contract Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-wasm
          path: contracts/soroban/target/wasm32v1-none/release/*.wasm
          retention-days: 1

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [client-checks]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun x playwright install chromium

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  visual-e2e:
    name: Visual & Cross-Browser E2E
    runs-on: ubuntu-latest
    needs: [client-checks]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium firefox webkit

      - name: Run visual & cross-browser regression tests
        run: bun run test:visual
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces & diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-playwright-traces
          path: test-results/
          retention-days: 7

  security:
    name: Security & Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        with:
          retry-on-snapshot-warnings: true
          fail-on-severity: moderate

      - name: Install Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks

      - name: Scan Git history for secrets
        run: /tmp/gitleaks git . --redact --verbose

  provenance:
    name: Provenance & Hashes
    needs: [client-checks, contract-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ./artifacts

      - name: Generate SHA-256 Hashes
        run: |
          echo "### Release Artifact Hashes" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | SHA-256 Hash |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          # Collect and hash important artifacts
          find . -name "*.wasm" -o -name "index.html" -o -name "*.js" -o -name "*.css" | grep -v "node_modules" | while read file; do
            hash=$(sha256sum "$file" | awk '{print $1}')
            name=$(basename "$file")
            echo "| $name | $hash |" >> $GITHUB_STEP_SUMMARY
            echo "$hash  $file" >> SHA256SUMS
          done

      - name: Upload Hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-hashes
          path: SHA256SUMS
